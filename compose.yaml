services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_ORIGIN: http://localhost:8080
      DATABASE_URL: postgres://kanban:kanban@postgres:5432/kanban
      AUTO_MIGRATE: "true"
      SESSION_COOKIE_NAME: kanban_session
      SESSION_TTL_DAYS: 7
      COOKIE_SECURE: "false"
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - kanban_postgres_data:/var/lib/postgresql/data

volumes:
  kanban_postgres_data:
